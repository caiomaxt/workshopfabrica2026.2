<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Cadastro de Usuário</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Criar Conta</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-semibold hover:bg-indigo-700 transition">
                Salvar Cadastro
            </button>
        </form>
        <a href="{% url 'home' %}" class="block text-center text-sm text-gray-500 hover:underline mt-4">
            ← Voltar para o início
        </a>
    </div>
</body>
</html>
