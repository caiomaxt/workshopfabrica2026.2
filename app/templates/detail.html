<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Detalhes do Membro</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Perfil do Usuário</h2>
        <div class="space-y-3 text-gray-700">
            <p><span class="font-semibold">Usuário:</span> {{ usuario.username }}</p>
            <p><span class="font-semibold">E-mail:</span> {{ usuario.email|default:"Não informado" }}</p>
            <p><span class="font-semibold">Idade:</span> {{ usuario.age|default:"Não informada" }} anos</p>
            <p><span class="font-semibold">Telefone:</span> {{ usuario.phone|default:"Não informado" }}</p>
        </div>
        <a href="{% url 'home' %}" class="block text-center text-sm text-indigo-600 font-semibold hover:underline mt-6">
            ← Voltar para o início
        </a>
    </div>
</body>
</html>
