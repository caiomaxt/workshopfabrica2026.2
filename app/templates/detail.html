<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Member Profile</title>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-xl shadow-md max-w-md w-full">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">User Profile</h2>
        <div class="space-y-3 text-gray-700">
            <p><span class="font-semibold">Username:</span> {{ usuario.username }}</p>
            <p><span class="font-semibold">EEmail:</span> {{ usuario.email|default:"NNot provided" }}</p>
            <p><span class="font-semibold">Age:</span> {{ usuario.age|default:"NNot provided" }} years</p>
            <p><span class="font-semibold">Phone:</span> {{ usuario.phone|default:"NNot provided" }}</p>
        </div>
        <a href="{% url 'home' %}" class="block text-center text-sm text-indigo-600 font-semibold hover:underline mt-6">
            ← return to home
        </a>
    </div>
</body>
</html>
